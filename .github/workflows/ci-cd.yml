name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on GitHub's machines for every PR and every push to main.
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # Backend tests against a throwaway Postgres.
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudide
          POSTGRES_PASSWORD: cloudide
          POSTGRES_DB: cloudide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudide -d cloudide"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://cloudide:cloudide@localhost:5432/cloudide
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      # Fails if a model changed without a migration.
      - run: npm run migration:check

  # Runs on our server (self-hosted runner), only after a successful build on main.
  deploy:
    name: Deploy to ide.filegrid.cc.cd
    needs: [build, test-backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cloud-ide-deploy]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ide.filegrid.cc.cd
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/deploy.sh "${{ github.sha }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 https://ide.filegrid.cc.cd/api/health | grep -q "${{ github.sha }}"; then
              echo "Live site is serving ${{ github.sha }}"
              exit 0
            fi
            sleep 5
          done
          echo "Live site is not serving ${{ github.sha }} after 60s"
          exit 1
