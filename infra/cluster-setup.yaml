# One-time cluster setup, applied by root via infra/setup-runner.sh.
# The CI runner deploys with the "deployer" account, which can only touch
# the cloud-ide namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: cloud-ide
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: cloud-ide
---
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: cloud-ide
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: cloud-ide
rules:
  - apiGroups: [""]
    resources: [services, configmaps, secrets, persistentvolumeclaims, pods, pods/log, events]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: cloud-ide
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: cloud-ide
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
