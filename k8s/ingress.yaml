# Cloudflare proxies ide.filegrid.cc.cd to this server; k3s Traefik routes it here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-ide
spec:
  ingressClassName: traefik
  rules:
    - host: ide.filegrid.cc.cd
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
