apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: cloud-ide-backend
          # Images are built on the server and imported into k3s, never pulled.
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: database-url }
            # Projects' workspaces (US04). Same token as workspace-manager.yaml.
            - name: WORKSPACE_MANAGER_URL
              value: http://workspace-manager:8080
            - name: WORKSPACE_MANAGER_TOKEN
              valueFrom:
                secretKeyRef: { name: workspace-manager-token, key: token }
          # Keep serving for a few seconds after Traefik is told to stop routing here,
          # so rollouts don't drop requests.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # Startup waits for the database and runs migrations; liveness only begins after this.
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 3000
      targetPort: 3000
